<g class="pulse" opacity="0"><circle class="light" r="15" opacity=".6" filter="url(#glow)"/><circle class="light" r="4.5"/><animateMotion path="M627.0,180.0 L333.0,180.0" dur="1.22s" begin="1.1s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.8;1"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.76;.8;1" dur="1.22s" begin="1.1s" repeatCount="indefinite"/></g>
</svg>

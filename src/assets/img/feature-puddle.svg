<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Two Puddles connected directly">
<style>.node { fill: #1b2117 } .link { stroke: #1b2117 } .light { fill: #ccff00 } @media (prefers-color-scheme: dark) { .node { fill: #ccff00 } .link { stroke: #5d6a53 } .light { fill: #ffffff } } @media (prefers-reduced-motion: reduce) { .pulse { display: none } }</style>
<defs>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<g class="link" stroke-width="11" stroke-linecap="round">
<line x1="333.0" y1="180.0" x2="627.0" y2="180.0"/>
</g>
<g class="node">
<circle cx="250" cy="180" r="70"/>
<circle cx="710" cy="180" r="70"/>
</g>

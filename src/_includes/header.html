<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">ezp2p</a>
    <nav>
      {%- for item in site.nav %}
      {%- assign head = page.url | slice: 0, item.url.size %}
      <a href="{{ item.url | relative_url }}"{% if head == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
      <a href="{{ site.github }}">GitHub</a>
    </nav>
  </div>
</header>
